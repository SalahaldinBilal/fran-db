[package]
name = "fran-db"
version = "0.1.1"
description = "A desktop SQL client"
authors = ["SalahaldinBilal"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "fran_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = []

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false
required-features = ["e2e"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
async-trait = "0.1.92"
uuid = { version = "1.28.0", features = ["v4"] }
hex = "0.4.3"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
postgres-protocol = "0.6.12"
fallible-iterator = "0.2.0"
bytes = "1.12.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.11"
socket2 = "0.6.5"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
keyring = "4.2.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
zeroize = "1.9.1"
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "column_decltype", "column_metadata"] }

[dev-dependencies]
testcontainers = { version = "0.28.0", features = ["blocking"] }
libtest-mimic = "0.8.2"
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled", "functions"] }
